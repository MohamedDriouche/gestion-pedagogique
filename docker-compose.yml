services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gestion_pedagogique
      MYSQL_USER: gestion
      MYSQL_PASSWORD: gestion123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
